<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="2048 Undo">
<meta name="theme-color" content="#f8f7ef">
<title>2048 Undo</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<style>
:root{
  --u: calc(min(100vw, 430px) / 390);
  --bg:#f8f7ef; --frame:#b8ada1; --cell:#c9c0b5; --btn:#e19c66;
  --dark:#756e66; --label:#ece4d5; --logo:#e4c542;
  --slide:100ms;
  font-family: ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, system-ui, "Helvetica Neue", Arial, sans-serif;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent; -webkit-user-select:none; user-select:none}
html,body{margin:0; height:100%; background:var(--bg); overflow:hidden; overscroll-behavior:none; touch-action:none}
body{color:var(--dark); -webkit-font-smoothing:antialiased}
#app{position:relative; width:min(100vw,430px); margin:0 auto; height:100%;
  padding-top:calc(env(safe-area-inset-top) + var(--u)*14)}
#top{position:relative; height:calc(var(--u)*150)}
#logo{position:absolute; left:calc(var(--u)*14); top:0; width:calc(var(--u)*104); height:calc(var(--u)*106);
  background:var(--logo); border-radius:calc(var(--u)*4); color:#fff; font-weight:700;
  font-size:calc(var(--u)*36); display:flex; align-items:center; justify-content:center; letter-spacing:calc(var(--u)*-0.5)}
.box{position:absolute; top:0; width:calc(var(--u)*94); height:calc(var(--u)*92); background:var(--frame);
  border-radius:calc(var(--u)*4); color:#fff; text-align:center; font-weight:700}
.box .lbl{color:var(--label); font-size:calc(var(--u)*15); margin-top:calc(var(--u)*13); letter-spacing:calc(var(--u)*0.3)}
.box .val{display:inline-block; font-size:calc(var(--u)*25); margin-top:calc(var(--u)*7); white-space:nowrap; letter-spacing:calc(var(--u)*-0.3)}
#scoreBox{left:calc(var(--u)*172)} #bestBox{left:calc(var(--u)*282)}
.tbtn{position:absolute; top:calc(var(--u)*106); width:calc(var(--u)*94); height:calc(var(--u)*28);
  background:var(--btn); color:#fff; border:0; border-radius:calc(var(--u)*4); font:inherit; font-weight:700;
  font-size:calc(var(--u)*11); letter-spacing:calc(var(--u)*0.3); padding:0; touch-action:manipulation}
#menuBtn{left:calc(var(--u)*172)} #lbBtn{left:calc(var(--u)*282)}
#goal{margin:0 calc(var(--u)*14) 0; height:calc(var(--u)*46); font-weight:600; font-size:calc(var(--u)*16.3);
  line-height:calc(var(--u)*20); white-space:nowrap}
#board{position:relative; margin-left:calc(var(--u)*16); width:calc(var(--u)*357); height:calc(var(--u)*357);
  background:var(--frame); border-radius:calc(var(--u)*6)}
.cellbg{position:absolute; background:var(--cell); border-radius:calc(var(--u)*3)}
.tile{position:absolute; left:0; top:0; transition:transform var(--slide) cubic-bezier(.25,.6,.3,1); will-change:transform; z-index:2; backface-visibility:hidden}
.tile.merged{z-index:3}
.tin{width:100%; height:100%; border-radius:calc(var(--u)*3); display:flex; align-items:center; justify-content:center;
  font-weight:700; white-space:nowrap}
.tile.new .tin{animation:appear 130ms ease-out backwards}
.tile.merged{z-index:3}
.tile.merged .tin{animation:pop 130ms ease-out}
.snap .tile{transition:none!important}
@keyframes appear{from{transform:scale(.3)} to{transform:scale(1)}}
@keyframes pop{0%{transform:scale(1)} 50%{transform:scale(1.1)} 100%{transform:scale(1)}}
/* ---------- high tiles: flat like the rest, a few with a fine inner line or soft text glow ---------- */
.tile{border-radius:calc(var(--u)*3)}
.tin[data-t="22"]{text-shadow:0 0 .35em rgba(169,212,255,.55)}
.tin[data-t="23"]{box-shadow:inset 0 0 0 2px #d8b45a}
.tin[data-t="24"]{box-shadow:inset 0 0 0 2px rgba(228,197,66,.6)}
/* level-up flash when a legendary tile is created */
.tile.lvl{animation:lvl 900ms ease-out}
@keyframes lvl{0%{box-shadow:0 0 0 0 rgba(255,255,255,.95),0 0 18px 6px rgba(255,220,120,.9)}
  100%{box-shadow:0 0 0 calc(var(--u)*14) rgba(255,255,255,0),0 0 0 0 rgba(255,220,120,0)}}
.noanim .tile{transition:none} .noanim .tin{animation:none!important}
#undoWrap{display:flex; justify-content:center; margin-top:calc(var(--u)*28)}
#undoBtn{width:calc(var(--u)*68); height:calc(var(--u)*68); border-radius:50%; border:0; background:var(--btn);
  display:flex; align-items:center; justify-content:center; padding:0; touch-action:manipulation;
  box-shadow:0 calc(var(--u)*2) calc(var(--u)*6) rgba(117,110,102,.25); transition:background .15s, transform .08s}
#undoBtn:active{transform:scale(0.93)}
#undoBtn svg{width:55%; height:55%}
#undoBtn:disabled{background:var(--cell); box-shadow:none}
#over{position:absolute; inset:0; border-radius:calc(var(--u)*6); background:rgba(238,228,218,.73); z-index:10;
  display:none; flex-direction:column; align-items:center; justify-content:center; animation:fade .4s ease}
#over.show{display:flex}
#over h2{margin:0; font-size:calc(var(--u)*44); font-weight:700; color:var(--dark)}
#over p{margin:calc(var(--u)*6) 0 calc(var(--u)*20); font-size:calc(var(--u)*18); font-weight:600}
@keyframes fade{from{opacity:0} to{opacity:1}}
.row{display:flex; gap:calc(var(--u)*10)}
.btn{background:var(--btn); color:#fff; border:0; border-radius:calc(var(--u)*5); font:inherit; font-weight:700;
  font-size:calc(var(--u)*16); padding:calc(var(--u)*11) calc(var(--u)*18); touch-action:manipulation}
.btn.grey{background:var(--frame)}
.btn:disabled{opacity:.5}
/* modals */
.modal{position:fixed; inset:0; background:rgba(117,110,102,.45); z-index:50; display:none; align-items:center; justify-content:center; padding:calc(var(--u)*16)}
.modal.show{display:flex; animation:fade .18s ease}
.panel{background:var(--bg); border-radius:calc(var(--u)*8); width:min(100%, calc(var(--u)*340)); max-height:88vh; overflow:auto;
  padding:calc(var(--u)*20); box-shadow:0 calc(var(--u)*8) calc(var(--u)*30) rgba(0,0,0,.2); touch-action:pan-y}
.panel h3{margin:0 0 calc(var(--u)*16); font-size:calc(var(--u)*26); font-weight:700; text-align:center}
.panel .stack{display:flex; flex-direction:column; gap:calc(var(--u)*10)}
.panel .stack .btn{width:100%}
.sect{font-weight:700; font-size:calc(var(--u)*13); letter-spacing:calc(var(--u)*0.5); margin:calc(var(--u)*16) 0 calc(var(--u)*8); text-transform:uppercase}
.seg{display:flex; gap:calc(var(--u)*6); flex-wrap:wrap}
.seg button{flex:1; min-width:calc(var(--u)*44); background:var(--cell); color:#fff; border:0; border-radius:calc(var(--u)*5);
  font:inherit; font-weight:700; font-size:calc(var(--u)*14); padding:calc(var(--u)*9) 0; touch-action:manipulation}
.seg button.on{background:var(--btn)}
.note{font-size:calc(var(--u)*12.5); font-weight:600; margin-top:calc(var(--u)*6); line-height:1.35}
textarea{width:100%; height:calc(var(--u)*90); border:2px solid var(--frame); border-radius:calc(var(--u)*5); background:#fff;
  font:12px ui-monospace,monospace; color:var(--dark); padding:6px; -webkit-user-select:text; user-select:text; resize:none}
.lb{width:100%; border-collapse:collapse; font-weight:700; font-size:calc(var(--u)*14)}
.lb td{padding:calc(var(--u)*7) calc(var(--u)*3); border-bottom:1px solid #e6dfd3; vertical-align:middle}
.lb td.r{text-align:right} .lb .rk{width:1.6em; color:#a99f94}
.lb .sc{font-size:calc(var(--u)*16); font-weight:700}
.lb .sub{font-size:calc(var(--u)*11.5); color:#a99f94; font-weight:700}
.chip{display:inline-block; min-width:calc(var(--u)*46); padding:calc(var(--u)*3) calc(var(--u)*5); border-radius:calc(var(--u)*3);
  text-align:center; font-weight:700; font-size:calc(var(--u)*12)}
#warn{display:none; position:fixed; left:0; right:0; top:0; z-index:60; background:#c8202a; color:#fff; font-weight:700;
  font-size:13px; text-align:center; padding:calc(env(safe-area-inset-top) + 6px) 10px 6px}
#warn.show{display:block}
.empty{text-align:center; padding:calc(var(--u)*20) 0; font-weight:700}
</style>
</head>
<body>
<div id="warn">Saving failed. Please export a backup: Menu → Settings → Export</div>
<div id="app">
  <div id="top">
    <div id="logo">2048</div>
    <div class="box" id="scoreBox"><div class="lbl">SCORE</div><div class="val" id="score">0</div></div>
    <div class="box" id="bestBox"><div class="lbl">BEST</div><div class="val" id="best">0</div></div>
    <button class="tbtn" id="menuBtn">MENU</button>
    <button class="tbtn" id="lbBtn">LEADERBOARD</button>
  </div>
  <div id="goal"></div>
  <div id="board">
    <div id="cells"></div>
    <div id="tiles"></div>
    <div id="over"><h2>Game over!</h2><p id="overScore"></p>
      <div class="row"><button class="btn" id="overUndo">Undo</button><button class="btn" id="overNew">New Game</button></div></div>
  </div>
  <div id="undoWrap"><button id="undoBtn" aria-label="Undo">
    <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M8.5 4.5 4 9l4.5 4.5"/><path d="M4.5 9H14a5.5 5.5 0 0 1 0 11h-3.5"/></svg>
  </button></div>
</div>

<div class="modal" id="menuModal"><div class="panel"><h3>Menu</h3><div class="stack">
  <button class="btn" data-act="continue">Continue</button>
  <button class="btn" data-act="new">New Game</button>
  <button class="btn" data-act="settings">Settings</button>
</div></div></div>

<div class="modal" id="setModal"><div class="panel"><h3>Settings</h3>
  <div class="sect">Board size</div><div class="seg" id="sizeSeg"></div>
  <div class="note">Every size keeps its own game, best score and leaderboard.</div>
  <div class="sect">Animation speed</div><div class="seg" id="speedSeg"></div>
  <div class="sect">Backup</div>
  <div class="row"><button class="btn grey" id="expBtn" style="flex:1">Export</button><button class="btn grey" id="impBtn" style="flex:1">Import</button></div>
  <div id="bkArea" style="display:none; margin-top:10px">
    <textarea id="bkText"></textarea>
    <div class="row" style="margin-top:8px"><button class="btn" id="bkAction" style="flex:1"></button></div>
    <div class="note" id="bkNote"></div>
  </div>
  <div class="sect">Best score</div>
  <button class="btn grey" id="resetBest" style="width:100%">Reset best score</button>
  <div style="margin-top:18px"><button class="btn" data-close style="width:100%">Done</button></div>
</div></div>

<div class="modal" id="lbModal"><div class="panel"><h3 id="lbTitle">Leaderboard</h3>
  <div id="lbBody"></div>
  <div style="margin-top:16px"><button class="btn" data-close style="width:100%">Close</button></div>
</div></div>

<div class="modal" id="cfModal"><div class="panel"><h3 id="cfTitle"></h3>
  <div class="note" id="cfText" style="text-align:center; font-size:calc(var(--u)*15); margin:0 0 18px"></div>
  <div class="row"><button class="btn grey" id="cfNo" style="flex:1">Cancel</button><button class="btn" id="cfYes" style="flex:1">OK</button></div>
</div></div>

<script>
(() => {
'use strict';
const P = 'u2048:';
const SPEEDS = {Normal:90, Fast:55, Off:0};
const $ = id => document.getElementById(id);

// ---------- storage ----------
const store = {
  get(k, d){ try{ const v = localStorage.getItem(P+k); return v==null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){
    try{ localStorage.setItem(P+k, JSON.stringify(v)); return true; }
    catch(e){ return false; }
  }
};

// Undo history lives in IndexedDB in chunks, so the board itself (localStorage) stays tiny and always saves.
const idb = (() => {
  let dbp = null;
  const open = () => dbp || (dbp = new Promise((res, rej) => {
    try{ const r = indexedDB.open('u2048', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('hist');
      r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }catch(e){ rej(e); }
  }));
  const range = n => IDBKeyRange.bound(n+':', n+':\uffff');
  return {
    async rows(n){ const db = await open(); return new Promise((res, rej) => {
      const out = []; const rq = db.transaction('hist').objectStore('hist').openCursor(range(n));
      rq.onsuccess = () => { const c = rq.result; if(c){ out.push([c.key, c.value]); c.continue(); } else res(out); };
      rq.onerror = () => rej(rq.error); }); },
    async write(puts, dels, clearN){ const db = await open(); return new Promise((res, rej) => {
      const tx = db.transaction('hist', 'readwrite'); const st = tx.objectStore('hist');
      if(clearN != null) st.delete(range(clearN));
      for(const [k,v] of puts) st.put(v, k);
      for(const k of dels) st.delete(k);
      tx.oncomplete = res; tx.onerror = tx.onabort = () => rej(tx.error); }); }
  };
})();

let meta = store.get('meta', null);
if(!meta){
  meta = {size:4, speed:'Normal', best:{4:164148}, record:{4:13},
    lb:{4:[{id:'orig', score:164148, tile:13, date:null, undos:null}]}};
  store.set('meta', meta);
}
const saveMeta = () => { if(!noSave) store.set('meta', meta); };

// ---------- colours ----------
const COLORS = {1:['#ece4db','#756e66'],2:['#eadfca','#756e66'],3:['#e8b381'],4:['#df915f'],5:['#e8806a'],6:['#dc5f45'],
  7:['#eed97b'],8:['#e9cd5c'],9:['#dcbd45'],10:['#d9b23a'],11:['#e4c542'],12:['#80d799'],13:['#5fa3e0'],
  14:['#8c7fe0'],15:['#d46fb5'],16:['#c8202a']};
// 131072 and up: a second round of deeper tones, some with their own text colour
const HIGH = {17:['#2b5d8a','#ffffff'],   // 131072  ocean blue
  18:['#3cc9c0','#0f4f4b'],               // 262144  turquoise, petrol digits
  19:['#3d3a33','#f2d27a'],               // 524288  charcoal, gold digits
  20:['#9c2f5c','#ffd3e6'],               // 1048576 berry, pink digits
  21:['#a8d5b5','#2f5d3f'],               // 2097152 sage, forest digits
  22:['#1c2a48','#a9d4ff'],               // 4194304 midnight, ice digits
  23:['#f4efe6','#b8892a'],               // 8388608 ivory, gold line + digits
  24:['#151515','#e4c542']};              // 16777216+ black, logo-yellow digits
function colorOf(e){ const c = COLORS[e]; if(c) return [c[0], c[1]||'#fff']; return HIGH[Math.min(e, 24)]; }
const val = e => Math.pow(2, e);
const fmt = n => String(n);

// ---------- state ----------
let N, game, grid, tileEls = new Map(), nextId = 1;
let pending = null, busy = false;

function emptyCells(){ return new Array(N*N).fill(0); }
const enc = cells => cells.map(e => e.toString(36)).join('');
const dec = s => s.split('').map(ch => parseInt(ch, 36));

const CH = 500;                         // history entries per IndexedDB chunk
let histReady = false, histBase = 0, histDirty = Infinity, histChunks = 0, histClear = false, migrated = null;
let saveFailed = false;
const ckey = (n, i) => n + ':' + String(i).padStart(6, '0');

function loadGame(n){
  N = n;
  let g = store.get('game:'+n, null);
  migrated = null;
  if(!g || !g.cells || g.cells.length !== n*n){
    const c = emptyCells(); spawnInto(c); spawnInto(c);
    g = {id: Date.now(), cells: enc(c), score:0, undos:0, over:false, hl:0};
  }
  if(Array.isArray(g.hist)){ migrated = g.hist; g.hl = g.hist.length; }   // old save format
  game = {id:g.id, cells:g.cells, score:g.score||0, undos:g.undos||0, over:!!g.over, hl:g.hl||0, hist:[]};
  histReady = false; histBase = game.hl; histDirty = Infinity; histClear = false; histChunks = 0;
  if(meta.best[n] == null) meta.best[n] = 0;
  if(meta.record[n] == null) meta.record[n] = 0;
  if(!meta.lb[n]) meta.lb[n] = [];
  // keep best / record in line with the stored game (e.g. after an import)
  meta.best[n] = Math.max(meta.best[n], game.score);
  meta.record[n] = Math.max(meta.record[n], ...dec(game.cells));
}
function loadHist(){
  const n = N, gid = game.id;
  const ready = base => {
    game.hist = base.concat(game.hist);
    histDirty = Math.min(histDirty, base.length);
    histBase = 0; histReady = true; hud(); saveHist(); saveGame();
  };
  if(migrated){ histClear = true; const m = migrated; migrated = null; ready(m); return; }
  if(!game.hl){ histClear = true; ready([]); return; }
  idb.rows(n).then(rows => {
    if(N !== n || game.id !== gid || histReady) return;
    rows.sort((a,b) => a[0] < b[0] ? -1 : 1);
    if(rows.some(r => r[1].gid !== gid)) histClear = true;
    histChunks = rows.length;
    const items = [].concat(...rows.filter(r => r[1].gid === gid).map(r => r[1].items));
    ready(items.slice(0, game.hl));
  }).catch(() => { if(N === n && game.id === gid && !histReady) ready([]); });
}
let noSave = false;
function saveGame(){
  if(noSave) return;
  game.cells = enc(cellsFromGrid());
  const g = {id:game.id, cells:game.cells, score:game.score, undos:game.undos, over:game.over, hl:histBase + game.hist.length};
  const ok = store.set('game:'+N, g);
  if(!ok !== saveFailed){ saveFailed = !ok; $('warn').classList.toggle('show', saveFailed); }
}
function saveHist(){
  if(noSave || !histReady) return;
  const n = N, gid = game.id, h = game.hist;
  const last = h.length ? Math.floor((h.length-1)/CH) : -1;
  const dels = []; for(let i = last+1; i < histChunks; i++) dels.push(ckey(n, i));
  if(histDirty === Infinity && !histClear && !dels.length) return;
  const from = histClear ? 0 : Math.floor(Math.min(histDirty, Math.max(h.length-1, 0))/CH);
  const puts = []; for(let i = from; i <= last; i++) puts.push([ckey(n, i), {gid, items:h.slice(i*CH, (i+1)*CH)}]);
  const clear = histClear ? n : null;
  histChunks = last+1; histDirty = Infinity; histClear = false;
  idb.write(puts, dels, clear).catch(() => {});
}
function spawnInto(cells){
  const free = []; cells.forEach((e,i) => { if(!e) free.push(i); });
  if(!free.length) return -1;
  const i = free[Math.floor(Math.random()*free.length)];
  cells[i] = Math.random() < 0.9 ? 1 : 2;
  return i;
}

// ---------- geometry ----------
let G = {};
function geometry(){
  const B = $('board').clientWidth;
  const c = B / (N + 0.14*(N+1));
  const g = 0.14*c;
  G = {B, c, g};
}
const pos = (r, c) => [G.g + c*(G.c+G.g), G.g + r*(G.c+G.g)];
function fontFor(e){
  const d = String(val(e)).length;
  const f = d<=2 ? 0.5 : d===3 ? 0.42 : d===4 ? 0.33 : 1.35/d;
  return f * G.c;
}

function buildCells(){
  const wrap = $('cells'); wrap.innerHTML = '';
  for(let r=0;r<N;r++) for(let c=0;c<N;c++){
    const d = document.createElement('div'); d.className = 'cellbg';
    const [x,y] = pos(r,c);
    Object.assign(d.style, {left:x+'px', top:y+'px', width:G.c+'px', height:G.c+'px'});
    wrap.appendChild(d);
  }
}
function makeTile(t, cls){
  const el = document.createElement('div'); el.className = 'tile' + (cls ? ' '+cls : '');
  const inn = document.createElement('div'); inn.className = 'tin';
  el.appendChild(inn);
  el.style.width = el.style.height = G.c + 'px';
  styleTile(el, t.e);
  placeEl(el, t.r, t.c);
  $('tiles').appendChild(el);
  tileEls.set(t.id, el);
  return el;
}
function styleTile(el, e){
  const inn = el.firstChild;
  inn.style.fontSize = fontFor(e) + 'px';
  const [bg, fg] = colorOf(e);
  inn.style.background = bg; inn.style.color = fg;
  if(e >= 22) inn.dataset.t = Math.min(e, 24); else delete inn.dataset.t;
  inn.textContent = val(e);
}
function placeEl(el, r, c){ const [x,y] = pos(r,c); el.style.transform = `translate3d(${x}px,${y}px,0)`; }

function cellsFromGrid(){ const a = emptyCells(); for(let r=0;r<N;r++) for(let c=0;c<N;c++){ const t = grid[r][c]; if(t) a[r*N+c] = t.e; } return a; }
function gridFromCells(cells){
  grid = []; for(let r=0;r<N;r++){ grid.push([]); for(let c=0;c<N;c++){ const e = cells[r*N+c]; grid[r].push(e ? {id:nextId++, e, r, c} : null); } }
}
function renderAll(anim){
  $('tiles').innerHTML = ''; tileEls.clear();
  $('board').classList.add('noanim');
  for(const row of grid) for(const t of row) if(t){ const el = makeTile(t, ''); if(anim) animateOnce(el, 'new'); }
  void $('board').offsetWidth;
  if(!anim) requestAnimationFrame(() => $('board').classList.remove('noanim'));
  else $('board').classList.remove('noanim');
}

// ---------- HUD ----------
function setVal(el, n){
  const s = fmt(n); if(el.textContent === s) return;
  el.textContent = s;
  el.style.fontSize = '';
  const max = el.parentElement.clientWidth * 0.9;
  let fs = parseFloat(getComputedStyle(el).fontSize);
  while(el.scrollWidth > max && fs > 8){ fs -= 0.5; el.style.fontSize = fs + 'px'; }
}
function hud(){
  setVal($('score'), game.score);
  setVal($('best'), meta.best[N]);
  const goal = Math.max(2048, val(meta.record[N]) * 2);
  $('goal').textContent = `Your next goal is to get to the ${goal} tile!`;
  const canUndo = histReady && game.hist.length > 0;
  $('undoBtn').disabled = !canUndo;
  $('overUndo').disabled = !canUndo;
  $('overScore').textContent = 'Score: ' + game.score;
  $('over').classList.toggle('show', !!game.over);
}

// ---------- moves ----------
const DIRS = {left:[0,-1], right:[0,1], up:[-1,0], down:[1,0]};
function lines(dir){
  const L = [];
  for(let i=0;i<N;i++){
    const line = [];
    for(let j=0;j<N;j++){
      if(dir==='left') line.push([i,j]);
      else if(dir==='right') line.push([i,N-1-j]);
      else if(dir==='up') line.push([j,i]);
      else line.push([N-1-j,i]);
    }
    L.push(line);
  }
  return L;
}
function canMove(){
  for(let r=0;r<N;r++) for(let c=0;c<N;c++){
    const t = grid[r][c]; if(!t) return true;
    if(c+1<N && grid[r][c+1] && grid[r][c+1].e===t.e) return true;
    if(r+1<N && grid[r+1][c] && grid[r+1][c].e===t.e) return true;
  }
  return false;
}
function snap(){ const b = $('tiles'); b.classList.add('snap'); void b.offsetWidth; b.classList.remove('snap'); }
const ANIM = {new:'appear', merged:'pop', lvl:'lvl'};
function animateOnce(el, cls){
  el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls);
  const done = () => { el.classList.remove(cls); el.removeEventListener('animationend', h); };
  const h = ev => { if(ev.animationName === ANIM[cls]) done(); };
  el.addEventListener('animationend', h);
  setTimeout(done, 1500);
}
function finishPending(interrupt){
  if(!pending) return;
  clearTimeout(pending.timer);
  const p = pending; pending = null;
  for(const t of p.merged){ const el = tileEls.get(t.id); if(el){ el.style.zIndex = ''; animateOnce(el, 'merged'); if(t.e >= 17) animateOnce(el, 'lvl'); } }
  if(p.spawn) animateOnce(makeTile(p.spawn, ''), 'new');
  if(interrupt) snap();
  if(game.over) hud();
}
let saveT = 0;
function scheduleSave(){ clearTimeout(saveT); saveT = setTimeout(flushSave, 300); }
function flushSave(){ clearTimeout(saveT); saveGame(); saveMeta(); saveHist(); }
function move(dir){
  if(game.over || anyModal()) return;
  const before = enc(cellsFromGrid()) + '|' + game.score;
  const ng = []; for(let r=0;r<N;r++) ng.push(new Array(N).fill(null));
  const moves = [], pairs = [], merged = [];
  let gained = 0, changed = false;
  for(const line of lines(dir)){
    const ts = line.map(([r,c]) => grid[r][c]).filter(Boolean);
    let k = 0;
    for(let i=0;i<ts.length;i++){
      const [tr, tc] = line[k];
      const a = ts[i], b = ts[i+1];
      if(b && b.e === a.e){
        const m = {id:nextId++, e:a.e+1, r:tr, c:tc};
        pairs.push([a,b,m]); merged.push(m);
        ng[tr][tc] = m; gained += val(m.e); changed = true; i++;
      } else {
        if(a.r!==tr || a.c!==tc) changed = true;
        moves.push([a,tr,tc]); ng[tr][tc] = a;
      }
      k++;
    }
  }
  if(!changed) return;           // nothing can move: do absolutely nothing
  finishPending(true);            // previous animation: settle instantly
  for(const [a,tr,tc] of moves){ a.r = tr; a.c = tc; }
  game.hist.push(before); histDirty = Math.min(histDirty, game.hist.length-1);
  grid = ng;
  game.score += gained;
  // spawn: always a fresh random roll
  const free = []; for(let r=0;r<N;r++) for(let c=0;c<N;c++) if(!grid[r][c]) free.push([r,c]);
  let spawn = null;
  if(free.length){
    const [r,c] = free[Math.floor(Math.random()*free.length)];
    spawn = {id:nextId++, e: Math.random()<0.9 ? 1 : 2, r, c}; grid[r][c] = spawn;
  }
  // records
  if(game.score > (meta.best[N]||0)) meta.best[N] = game.score;
  for(const m of merged) if(m.e > (meta.record[N]||0)) meta.record[N] = m.e;
  game.over = !canMove();
  if(game.over) upsertLb();
  saveGame(); scheduleSave();
  // animate
  for(const [t,r,c] of moves){ const el = tileEls.get(t.id); if(el) placeEl(el, r, c); }
  // merge like the original: the front tile vanishes, the rear tile becomes the merged value and slides in
  for(const [a,b,m] of pairs){
    const ea = tileEls.get(a.id); if(ea){ ea.remove(); tileEls.delete(a.id); }
    const eb = tileEls.get(b.id); tileEls.delete(b.id);
    if(eb){ tileEls.set(m.id, eb); styleTile(eb, m.e); eb.style.zIndex = '3'; placeEl(eb, m.r, m.c); }
    else makeTile(m, '');
  }
  const ms = SPEEDS[meta.speed] ?? 100;
  pending = {merged, spawn, timer:0};
  hud(); $('over').classList.remove('show');
  if(ms === 0) finishPending(true);
  else pending.timer = setTimeout(() => finishPending(false), ms);
}
function undo(){
  if(!histReady || !game.hist.length || anyModal()) return;
  finishPending();
  const [cs, sc] = game.hist.pop().split('|'); histDirty = Math.min(histDirty, game.hist.length);
  gridFromCells(dec(cs)); game.score = +sc; game.over = false; game.undos++;
  saveGame(); scheduleSave(); renderAll(false); hud();
}

// ---------- leaderboard ----------
function upsertLb(){
  if(game.score <= 0) return;
  const tile = Math.max(...cellsFromGrid());
  const list = meta.lb[N] || (meta.lb[N] = []);
  const e = list.find(x => x.id === game.id);
  if(e){ if(game.score >= e.score){ e.score = game.score; e.tile = Math.max(e.tile, tile); e.undos = game.undos; e.date = Date.now(); } }
  else list.push({id:game.id, score:game.score, tile, date:Date.now(), undos:game.undos});
  list.sort((a,b) => b.score - a.score);
  meta.lb[N] = list.slice(0, 10);
  saveMeta();
}
function showLb(){
  $('lbTitle').textContent = `Leaderboard · ${N}×${N}`;
  const list = meta.lb[N] || [];
  if(!list.length){ $('lbBody').innerHTML = '<div class="empty">No games yet.</div>'; }
  else {
    const rows = list.map((x,i) => {
      const [bg, fg] = colorOf(x.tile);
      const d = x.date ? new Date(x.date).toLocaleDateString('de-CH') : 'Original app';
      const u = x.undos == null ? '' : ` · ${x.undos} undo${x.undos===1?'':'s'}`;
      return `<tr><td class="rk">${i+1}</td><td><div class="sc">${x.score}</div><div class="sub">${d}${u}</div></td>
        <td class="r"><span class="chip" style="background:${bg};color:${fg}">${val(x.tile)}</span></td></tr>`;
    }).join('');
    $('lbBody').innerHTML = `<table class="lb">${rows}</table>`;
  }
  openModal('lbModal');
}

// ---------- modals ----------
const modals = ['menuModal','setModal','lbModal','cfModal'];
function anyModal(){ return modals.some(m => $(m).classList.contains('show')); }
function openModal(id){ $(id).classList.add('show'); }
function closeModal(id){ $(id).classList.remove('show'); }
function confirmBox(title, text, yes, cb){
  $('cfTitle').textContent = title; $('cfText').textContent = text; $('cfYes').textContent = yes;
  $('cfYes').onclick = () => { closeModal('cfModal'); cb(); };
  $('cfNo').onclick = () => closeModal('cfModal');
  openModal('cfModal');
}
document.querySelectorAll('[data-close]').forEach(b => b.onclick = () => closeModal(b.closest('.modal').id));
modals.forEach(m => $(m).addEventListener('click', e => { if(e.target.id === m) closeModal(m); }));

function newGame(){
  finishPending();
  upsertLb();
  game = {id: Date.now(), cells:'', score:0, hist:[], undos:0, over:false, hl:0};
  histReady = true; histBase = 0; histClear = true; histDirty = Infinity;
  const c = emptyCells(); spawnInto(c); spawnInto(c);
  gridFromCells(c); saveGame(); saveHist(); renderAll(true); hud();
}
function askNew(){
  if(game.score === 0 && !game.hist.length){ newGame(); return; }
  confirmBox('New game?', 'Your current game will end and go to the leaderboard.', 'New Game', newGame);
}
$('menuBtn').onclick = () => openModal('menuModal');
$('lbBtn').onclick = showLb;
$('menuModal').querySelectorAll('[data-act]').forEach(b => b.onclick = () => {
  closeModal('menuModal');
  const a = b.dataset.act;
  if(a === 'new') askNew();
  if(a === 'settings') showSettings();
});
$('undoBtn').onclick = undo;
$('overUndo').onclick = undo;
$('overNew').onclick = newGame;

// ---------- settings ----------
function showSettings(){
  const ss = $('sizeSeg'); ss.innerHTML = '';
  for(let n=3;n<=8;n++){
    const b = document.createElement('button'); b.textContent = n+'×'+n; b.className = n===N ? 'on' : '';
    b.onclick = () => { if(n===N) return; switchSize(n); showSettings(); };
    ss.appendChild(b);
  }
  const sp = $('speedSeg'); sp.innerHTML = '';
  for(const k of Object.keys(SPEEDS)){
    const b = document.createElement('button'); b.textContent = k; b.className = k===meta.speed ? 'on' : '';
    b.onclick = () => { meta.speed = k; saveMeta(); applySpeed(); showSettings(); };
    sp.appendChild(b);
  }
  $('bkArea').style.display = 'none';
  openModal('setModal');
}
function applySpeed(){ document.documentElement.style.setProperty('--slide', (SPEEDS[meta.speed] ?? 100) + 'ms'); }
function switchSize(n){
  finishPending(); saveGame(); saveHist();
  meta.size = n; saveMeta();
  loadGame(n); saveMeta(); geometry(); buildCells(); gridFromCells(dec(game.cells)); renderAll(false); hud(); loadHist();
}
$('resetBest').onclick = () => confirmBox('Reset best score?', `Best for ${N}×${N} will be set to your current score (${game.score}).`, 'Reset', () => {
  meta.best[N] = game.score; saveMeta(); hud();
});
function b64e(s){ return btoa(unescape(encodeURIComponent(s))); }
function b64d(s){ return decodeURIComponent(escape(atob(s.trim()))); }
$('expBtn').onclick = () => {
  saveGame(); saveMeta();
  const data = {}; for(let i=0;i<localStorage.length;i++){ const k = localStorage.key(i); if(k.startsWith(P)) data[k] = localStorage.getItem(k); }
  $('bkText').value = b64e(JSON.stringify(data)); $('bkText').readOnly = true;
  $('bkAction').textContent = 'Copy'; $('bkNote').textContent = 'Save this code somewhere safe (e.g. Notes). Boards, scores and settings are included; the undo history is not.';
  $('bkAction').onclick = async () => {
    try{ await navigator.clipboard.writeText($('bkText').value); $('bkNote').textContent = 'Copied!'; }
    catch(e){ $('bkText').select(); $('bkNote').textContent = 'Select all and copy manually.'; }
  };
  $('bkArea').style.display = 'block';
};
$('impBtn').onclick = () => {
  $('bkText').value = ''; $('bkText').readOnly = false;
  $('bkAction').textContent = 'Import'; $('bkNote').textContent = 'Paste a backup or restore code.';
  $('bkAction').onclick = () => {
    let data; try{ data = JSON.parse(b64d($('bkText').value)); }catch(e){ $('bkNote').textContent = 'Invalid code.'; return; }
    confirmBox('Import?', 'The games in this code replace your current ones.', 'Import', () => {
      noSave = true; clearTimeout(saveT);   // don't let the running game overwrite the import on reload
      for(const [k,v] of Object.entries(data)) if(k.startsWith(P)) localStorage.setItem(k, v);
      location.reload();
    });
  };
  $('bkArea').style.display = 'block';
};

// ---------- input ----------
let sx = 0, sy = 0, tracking = false;
document.addEventListener('touchstart', e => {
  if(e.touches.length !== 1) { tracking = false; return; }
  sx = e.touches[0].clientX; sy = e.touches[0].clientY;
  tracking = sy < window.innerHeight - 90 && sy > 40;
}, {passive:true});
document.addEventListener('touchmove', e => {
  if(!e.target.closest('.panel')) e.preventDefault();
  if(!tracking || e.touches.length !== 1) return;
  const t = e.touches[0]; const dx = t.clientX - sx, dy = t.clientY - sy;
  const ax = Math.abs(dx), ay = Math.abs(dy);
  if(Math.max(ax, ay) < 22) return;
  tracking = false;
  if(ax > ay) move(dx > 0 ? 'right' : 'left'); else move(dy > 0 ? 'down' : 'up');
}, {passive:false});
document.addEventListener('touchend', e => {
  if(!tracking) return; tracking = false;
  const t = e.changedTouches[0]; const dx = t.clientX - sx, dy = t.clientY - sy;
  const ax = Math.abs(dx), ay = Math.abs(dy);
  if(Math.max(ax, ay) < 18) return;
  if(ax > ay) move(dx > 0 ? 'right' : 'left'); else move(dy > 0 ? 'down' : 'up');
});
document.addEventListener('keydown', e => {
  const k = {ArrowLeft:'left', ArrowRight:'right', ArrowUp:'up', ArrowDown:'down', a:'left', d:'right', w:'up', s:'down'}[e.key];
  if(k){ e.preventDefault(); move(k); return; }
  if(e.key === 'u' || e.key === 'Backspace' || ((e.metaKey||e.ctrlKey) && e.key === 'z')){ e.preventDefault(); undo(); }
  if(e.key === 'Escape') modals.forEach(closeModal);
});
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('dblclick', e => e.preventDefault());

window.addEventListener('resize', () => { finishPending(); geometry(); buildCells(); renderAll(false); });
document.addEventListener('visibilitychange', () => { if(document.hidden){ finishPending(true); flushSave(); } });
window.addEventListener('pagehide', () => { finishPending(true); flushSave(); });

// ---------- boot ----------
applySpeed();
loadGame(meta.size || 4);
saveMeta();
geometry(); buildCells(); gridFromCells(dec(game.cells)); renderAll(false); hud();
saveGame(); saveMeta(); loadHist();

if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{});
if('serviceWorker' in navigator && location.protocol === 'https:'){
  const hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.register('sw.js').catch(()=>{});
  // a new version was installed: save and reload once so it is used right away
  navigator.serviceWorker.addEventListener('controllerchange', () => { if(hadController){ flushSave(); location.reload(); } });
}

// test hook
window.__g = {move, undo, newGame, switchSize, get state(){ return {N, cells:cellsFromGrid(), score:game.score, hist:game.hist.length, over:game.over, ready:histReady}; },
  set(cells, score){ finishPending(); gridFromCells(cells); game.score = score||0; game.over = !canMove(); saveGame(); renderAll(false); hud(); }};
})();
</script>
